apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: bgp-advertisement
  labels:
    # This is crucial: it must match the advertisements.matchLabels defined in the CiliumBGPPeerConfig.
    # This is how Cilium links advertisements to peers.
    advertise: bgp
spec:
  advertisements:
    - advertisementType: "Service"
      service:
        addresses:
        - LoadBalancerIP  # LoadBalancerIP, ClusterIP, or ExternalIP
      selector:
        matchLabels:
          announcement: bgp
      attributes:
        communities:
          standard:
          - "64512:99"
        localPreference: 200